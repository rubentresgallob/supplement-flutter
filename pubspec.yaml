name: supplement_tracker
description: App de seguimiento de suplementación para el mercado español
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # API & Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # Utils
  intl: 0.20.3
  logger: ^2.0.2

  # UI
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.20
  forui: 0.27.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shop/
    # Textos legales: se muestran en la app y la web los sirve en /privacidad y /terminos
    - docs/legal/
  fonts:
    # El motor web de Flutter descarga Roboto desde los servidores de Google al
    # arrancar si no hay una familia "Roboto" en los assets. La declaramos (con
    # Poppins, que es lo que usa la app) para que la web no llame a Google.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
