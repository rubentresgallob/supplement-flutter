name: supplement_tracker
description: App de seguimiento de suplementación para el mercado español
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # API & Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # Utils
  intl: 0.20.3
  logger: ^2.0.2

  # UI
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.20
  forui: 0.27.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
